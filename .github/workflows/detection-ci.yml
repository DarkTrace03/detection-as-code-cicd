name: Detection-as-Code CI

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "tests/**"
      - "scripts/**"
      - "detections/**"
      - "requirements-dev.txt"
      - ".github/workflows/detection-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "rules/**"
      - "tests/**"
      - "scripts/**"
      - "detections/**"
      - "requirements-dev.txt"
      - ".github/workflows/detection-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-convert:
    name: Validate and Test Detection Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          sigma plugin install splunk
          sigma plugin install sysmon
          sigma list pipelines splunk

      - name: Validate Sigma metadata and MITRE tags
        run: python scripts/validate_rules.py

      - name: Run fixture tests
        run: pytest -v --junitxml=test-results.xml

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results.xml")
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a", encoding="utf-8") as out:
              out.write("## Detection-as-Code Test Summary\n\n")

              if not report.exists():
                  out.write("Test report was not generated. Check the test logs.\n")
                  raise SystemExit(0)

              root = ET.parse(report).getroot()
              suites = (
                  [root]
                  if root.tag == "testsuite"
                  else list(root.iter("testsuite"))
              )

              total = sum(int(s.get("tests", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              errors = sum(int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              passed = total - failures - errors - skipped

              out.write("| Metric | Count |\n")
              out.write("|---|---:|\n")
              out.write(f"| Total tests | {total} |\n")
              out.write(f"| Passed | {passed} |\n")
              out.write(f"| Failed | {failures} |\n")
              out.write(f"| Errors | {errors} |\n")
              out.write(f"| Skipped | {skipped} |\n\n")

              if failures or errors:
                  out.write("**Result: FAILED**\n")
              elif total == 0:
                  out.write("**Result: NO TESTS FOUND**\n")
              else:
                  out.write("**Result: PASSED**\n")
          PY

      - name: Validate Sigma rules exist
        shell: bash
        run: |
          set -euo pipefail

          count=0
          while IFS= read -r -d '' rule; do
            echo "Found Sigma rule: $rule"
            count=$((count + 1))
          done < <(
            find rules -type f \( -name '*.yml' -o -name '*.yaml' \) -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "::error::No Sigma YAML rules found in rules/"
            exit 1
          fi

          echo "Found $count Sigma rule(s)."

      - name: Convert Sigma rules to Splunk SPL
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          count=0

          while IFS= read -r -d '' rule; do
            name="$(basename "${rule%.*}")"

            sigma convert -t splunk -p sysmon "$rule" > "dist/${name}.spl"
            test -s "dist/${name}.spl"

            echo "Converted: $rule -> dist/${name}.spl"
            count=$((count + 1))
          done < <(
            find rules -type f \( -name '*.yml' -o -name '*.yaml' \) -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "::error::No Sigma rules were converted."
            exit 1
          fi

          echo "Successfully converted $count Sigma rule(s)."

      - name: Upload generated SPL
        uses: actions/upload-artifact@v4
        with:
          name: splunk-spl
          path: dist/*.spl
          if-no-files-found: error
          retention-days: 14


  deploy-splunk-lab:
    name: Deploy test Saved Search to Splunk
    needs: validate-and-convert
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, detection-lab]
    timeout-minutes: 5
    environment: splunk-lab

    permissions:
      contents: read

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4

      - name: Deploy and verify test Saved Search
        shell: cmd
        env:
          SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
          SPLUNK_USERNAME: ${{ secrets.SPLUNK_USERNAME }}
          SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}
        run: python scripts\deploy_splunk_saved_search.py