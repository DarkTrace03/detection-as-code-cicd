name: Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runner:
    name: Verify Windows Runner
    runs-on: [self-hosted, Windows, X64, detection-lab]
    timeout-minutes: 5

    steps:
      - name: Show runner information
        shell: cmd
        run: |
          echo Runner smoke test successful
          echo Computer: %COMPUTERNAME%
          echo OS: %OS%
          echo Workspace: %GITHUB_WORKSPACE%

      - name: Check required tools
        shell: cmd
        run: |
          git --version
          python --version